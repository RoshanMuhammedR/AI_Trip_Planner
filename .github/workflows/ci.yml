name: CI

on:
  push:
    branches: [main, modernization]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder values: `next build` must not need real credentials.
          # The env module treats CI as a build-time context and skips
          # connecting to anything.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: build-time-placeholder-secret-value-000000000
          AUTH_GOOGLE_ID: build-placeholder
          AUTH_GOOGLE_SECRET: build-placeholder
          GOOGLE_GENERATIVE_AI_API_KEY: build-placeholder

      - name: Assert no server secret leaked into the client bundle
        run: |
          if grep -rlE 'build-placeholder|build-time-placeholder-secret' .next/static/ 2>/dev/null; then
            echo "::error::A server-only environment variable was inlined into the client bundle."
            exit 1
          fi
          echo "OK — no server secrets found in .next/static/"
